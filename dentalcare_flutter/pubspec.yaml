name: prima_dental_care
description: Prima Dental Care - practice management mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.2.1
  intl: ^0.20.3
  http: ^1.2.0
  shared_preferences: ^2.3.0
  cupertino_icons: ^1.0.6
  pdf: ^3.11.1
  share_plus: ^7.2.2
  path_provider: ^2.1.4
  open_file: ^3.5.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/logo1.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/logo1.png"
